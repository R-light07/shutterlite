<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHUTTERLITE — Gestão de Mentorias</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh}.mt-admin{padding:130px 24px 80px}.mt-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:45px}.mt-title{font-size:clamp(38px,6vw,72px);font-weight:300;line-height:1}.mt-sub{color:var(--w50);margin-top:10px}.mt-actions{display:flex;gap:10px;flex-wrap:wrap}.mt-btn{height:46px;padding:0 22px;border:1px solid var(--w20);border-radius:9999px;text-transform:uppercase;letter-spacing:.18em;font-size:10px}.mt-btn.primary{background:#fff;color:#000}.mt-btn.danger{border-color:rgba(255,80,80,.35);color:#ff8888}.mt-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.mt-tab{padding:10px 18px;border:1px solid var(--w10);border-radius:9999px;text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--w50)}.mt-tab.active{background:#fff;color:#000;border-color:#fff}.mt-table{border:1px solid var(--w10);border-radius:20px;overflow:auto;background:var(--neutral-950)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:17px 18px;border-bottom:1px solid var(--w10);text-align:left;font-size:13px}th{text-transform:uppercase;letter-spacing:.16em;font-size:9px;color:var(--w40);font-weight:400}tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:6px 10px;border-radius:9999px;border:1px solid var(--w20);font-size:9px;text-transform:uppercase;letter-spacing:.15em}.badge.pending{color:#ddd}.badge.approved{background:#fff;color:#000;border-color:#fff}.badge.rejected{color:#ff8888;border-color:rgba(255,80,80,.35)}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.small{padding:8px 12px;border:1px solid var(--w20);border-radius:9999px;text-transform:uppercase;letter-spacing:.12em;font-size:9px}.empty{padding:80px;text-align:center;color:var(--w40);text-transform:uppercase;letter-spacing:.2em;font-size:11px}.login{max-width:500px;margin:15vh auto;padding:0 24px}.field{margin-bottom:16px}.field label{display:block;color:var(--w40);text-transform:uppercase;letter-spacing:.2em;font-size:9px;margin-bottom:8px}.field input,.field textarea,.field select{width:100%;background:var(--neutral-950);border:1px solid var(--w10);border-radius:14px;padding:15px 17px;font-size:14px}.notice{padding:15px 18px;border:1px solid var(--w10);border-radius:14px;color:var(--w60);font-size:13px;margin-bottom:20px}.notice.error{color:#ff8888;border-color:rgba(255,80,80,.3)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.open{display:flex}.modal-box{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--neutral-950);border:1px solid var(--w10);border-radius:24px;padding:28px}.modal-head{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px}.modal-title{font-size:26px;font-weight:300}.close{width:38px;height:38px;border:1px solid var(--w20);border-radius:50%}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.detail{padding:14px;border:1px solid var(--w10);border-radius:14px}.detail span{display:block;text-transform:uppercase;letter-spacing:.15em;color:var(--w40);font-size:8px;margin-bottom:5px}.detail strong{font-weight:300;font-size:14px}.detail.full{grid-column:1/-1;white-space:pre-wrap;line-height:1.6}@media(max-width:700px){.mt-head{display:block}.mt-actions{margin-top:20px}.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login">
<p class="section-eyebrow">SHUTTERLITE / Mentorias</p><h1 class="mt-title">Admin.</h1><p class="mt-sub" style="margin-bottom:30px">Gestão segura de candidaturas e alunos.</p>
<div id="loginErr" class="notice error" style="display:none"></div>
<form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="mt-btn primary" style="width:100%">Entrar</button></form>
</div>
<main id="app" class="mt-admin" style="display:none"><div class="section-narrow">
<div class="mt-head"><div><p class="section-eyebrow">Mentorias Online / Administração</p><h1 class="mt-title">Candidaturas.</h1><p class="mt-sub" id="adminUser"></p></div><div class="mt-actions"><button class="mt-btn" onclick="location.href='admin.html'">Admin principal</button><button class="mt-btn" onclick="logout()">Terminar sessão</button></div></div>
<div id="notice"></div><div class="mt-tabs"><button class="mt-tab active" data-status="all">Todas</button><button class="mt-tab" data-status="pending">Pendentes</button><button class="mt-tab" data-status="approved">Aprovadas</button><button class="mt-tab" data-status="rejected">Rejeitadas</button></div>
<div class="mt-table"><table><thead><tr><th>Candidato</th><th>Área</th><th>Nível</th><th>Data</th><th>Estado</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></main>
<div class="modal" id="detailModal"><div class="modal-box"><div class="modal-head"><div><p class="section-eyebrow">Candidatura</p><div class="modal-title" id="mTitle">—</div></div><button class="close" onclick="closeModal()">✕</button></div><div class="detail-grid" id="details"></div><div class="field" style="margin-top:18px"><label>Notas internas</label><textarea id="notes" rows="3"></textarea></div><div class="mt-actions" id="mActions"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://utcfzksfipgsktupwusg.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ1dGNmemtzZmlwZ3NrdHVwd3VzZyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg2MDE1MDY4LCJleHAiOjIxMDE1OTEwNjB9.Hp4nBYqZwRtmi50teeH5T-N-APT2y5HWrmylvGV-7n0';
/* Use the project's existing anon key in this constant. Never use a service_role key here. */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
let apps=[],filter='all',selected=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function ensureAdmin(){
 const {data:{session}}=await sb.auth.getSession(); if(!session){showLogin();return false}
 const {data:p,error}=await sb.from('mentoria_profiles').select('id,full_name,role,status').eq('id',session.user.id).maybeSingle();
 if(error||!p||p.role!=='admin'||p.status!=='active'){await sb.auth.signOut();showLogin();showErr('Esta conta não tem permissões de administrador.');return false}
 document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('adminUser').textContent=p.full_name||session.user.email;return true;
}
function showLogin(){document.getElementById('login').style.display='block';document.getElementById('app').style.display='none'}
function showErr(x){const e=document.getElementById('loginErr');e.textContent=x;e.style.display='block'}
async function load(){
 if(!await ensureAdmin())return;
 const {data,error}=await sb.from('mentoria_applications').select('*').order('created_at',{ascending:false});
 if(error){document.getElementById('notice').innerHTML='<div class="notice error">'+esc(error.message)+'</div>';return}
 apps=data||[];render();
}
function render(){
 const list=filter==='all'?apps:apps.filter(a=>a.status===filter),tb=document.getElementById('rows');
 if(!list.length){tb.innerHTML='<tr><td colspan="6" class="empty">Nenhuma candidatura encontrada</td></tr>';return}
 tb.innerHTML=list.map(a=>`<tr><td><strong>${esc(a.full_name)}</strong><div style="color:var(--w40);font-size:11px">${esc(a.email)}</div></td><td>${esc(a.interest_area)}</td><td>${esc(a.experience_level)}</td><td>${new Date(a.created_at).toLocaleDateString('pt-PT')}</td><td><span class="badge ${a.status}">${a.status==='pending'?'Pendente':a.status==='approved'?'Aprovada':'Rejeitada'}</span></td><td><div class="row-actions"><button class="small" onclick="openDetail('${a.id}')">Ver</button>${a.status==='pending'?`<button class="small" onclick="review('${a.id}','approved')">Aprovar</button><button class="small" onclick="review('${a.id}','rejected')">Rejeitar</button>`:''}</div></td></tr>`).join('');
}
function openDetail(id){
 selected=apps.find(a=>a.id===id);if(!selected)return;
 document.getElementById('mTitle').textContent=selected.full_name;document.getElementById('notes').value=selected.admin_notes||'';
 const fields=[['Email',selected.email],['Telefone',selected.phone],['País',selected.country],['Cidade',selected.city],['Área',selected.interest_area],['Nível',selected.experience_level],['Como conheceu',selected.how_found_us||'—'],['Estado',selected.status],['Objetivo',selected.goals],['Experiência',selected.experience],['Informações adicionais',selected.additional_information||'—']];
 document.getElementById('details').innerHTML=fields.map((x,i)=>`<div class="detail ${i>7?'full':''}"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('');
 document.getElementById('mActions').innerHTML=selected.status==='pending'?`<button class="mt-btn primary" onclick="review('${selected.id}','approved')">Aprovar</button><button class="mt-btn danger" onclick="review('${selected.id}','rejected')">Rejeitar</button>`:'';
 document.getElementById('detailModal').classList.add('open');
}
function closeModal(){document.getElementById('detailModal').classList.remove('open');selected=null}
async function review(id,status){
 if(!confirm(status==='approved'?'Aprovar esta candidatura?':'Rejeitar esta candidatura?'))return;
 const notes=document.getElementById('notes').value.trim()||null;
 const {error}=await sb.rpc('mentoria_review_application',{p_application_id:id,p_status:status,p_admin_notes:notes});
 if(error){alert(error.message);return}
 closeModal();await load();
}
async function logout(){await sb.auth.signOut();location.reload()}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){showErr(error.message);return}load()});
document.querySelectorAll('.mt-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mt-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.status;render()});
sb.auth.onAuthStateChange(()=>load());
load();
</script>
</body></html>
